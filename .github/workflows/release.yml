name: Build and Release

on:
  push:
    tags:
      - '*'

# Three independent channels. The GitHub release asset and the Docker image
# must never be hostage to Maven Central: for 4.9 the Central publish queue
# outlasted the plugin's poll window, the job "failed", and the release and
# docker steps were skipped while Central went on to publish anyway.
# Workflow permissions are least-privilege by default (see the maven-publish
# hardening); only the job that creates the GitHub release gets write access.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creates the release and uploads the jar asset

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    # Set version from tag
    - name: Set version from tag
      run: |
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        mvn versions:set -DnewVersion=${TAG_VERSION} -DgenerateBackupPoms=false

    # Build and run tests
    - name: Build and test
      run: mvn -B package

    # The published Maven artifact is now the thin jar; use the runnable "shaded" jar as the
    # downloadable CLI release asset, keeping the familiar TestingBotTunnel-<version>.jar name.
    - name: Prepare runnable jar for release
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        mkdir -p release-assets
        cp target/TestingBotTunnel-${VERSION}-shaded.jar release-assets/TestingBotTunnel-${VERSION}.jar
        # Same "HASH  FILE" form dist/build-runtime.sh writes, so every asset in a release
        # is verified the same way. Relative to the file, so `sha256sum -c` works from the
        # directory a user downloaded into.
        cd release-assets
        sha256sum "TestingBotTunnel-${VERSION}.jar" > "TestingBotTunnel-${VERSION}.jar.sha256"

    # Upload the runnable JAR as a release asset
    - name: Upload JAR to GitHub Releases
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
      with:
        files: |
          release-assets/TestingBotTunnel-*.jar
          release-assets/TestingBotTunnel-*.jar.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Self-contained distributions: a trimmed JDK (jlink) plus the jar, so users need
  # no Java installed. jlink emits a runtime for the platform it runs on, hence the
  # matrix. Each build is verified before upload, because a missing module fails at
  # runtime rather than at build time.
  native:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: testingbot-tunnel-linux-x64
          - os: ubuntu-24.04-arm
            asset: testingbot-tunnel-linux-arm64
          - os: macos-13
            asset: testingbot-tunnel-macos-x64
          - os: macos-latest
            asset: testingbot-tunnel-macos-arm64
          - os: windows-latest
            asset: testingbot-tunnel-windows-x64
    runs-on: ${{ matrix.os }}
    env:
      # secrets.* cannot be used in `if:`, so surface their presence as an env value.
      # Without them the macOS bundle is still built and released, just unsigned --
      # a release must not silently fail because a certificate expired.
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
      TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Set version from tag
      shell: bash
      run: |
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        mvn versions:set -DnewVersion=${TAG_VERSION} -DgenerateBackupPoms=false

    - name: Build JAR
      shell: bash
      run: mvn -B -DskipTests package

    # SKIP_ARCHIVE on macOS when signing: codesign rewrites every binary, so the
    # bundle is packed after signing instead. Every other platform packs here.
    - name: Build self-contained runtime
      shell: bash
      env:
        SKIP_ARCHIVE: ${{ runner.os == 'macOS' && env.HAS_SIGNING == 'true' && '1' || '0' }}
      run: dist/build-runtime.sh

    # ---- macOS signing, only when the certificate secrets are configured ----

    - name: Import signing certificate
      if: runner.os == 'macOS' && env.HAS_SIGNING == 'true'
      env:
        P12_B64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
        P12_PASS: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        KC_PASS: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      run: |
        set -euo pipefail
        KEYCHAIN="$RUNNER_TEMP/testingbot-signing.keychain-db"
        security create-keychain -p "$KC_PASS" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
        echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
          -P "$P12_PASS" -T /usr/bin/codesign
        # Default and searchable, so codesign and notarytool find the identity
        # and the stored profile.
        security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
        security default-keychain -s "$KEYCHAIN"
        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$KC_PASS" "$KEYCHAIN" >/dev/null
        rm -f "$RUNNER_TEMP/cert.p12"

    - name: Set up notarytool credentials
      if: runner.os == 'macOS' && env.HAS_SIGNING == 'true'
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      run: |
        set -euo pipefail
        # sign-macos.sh looks this profile up by name.
        xcrun notarytool store-credentials testingbot-notary \
          --apple-id "$APPLE_ID" \
          --team-id "$TEAM_ID" \
          --password "$APPLE_PASSWORD"

    # Signs every Mach-O in the jlink runtime, notarizes, then packs and
    # checksums the bundle.
    - name: Sign and notarize the macOS bundle
      if: runner.os == 'macOS' && env.HAS_SIGNING == 'true'
      run: dist/sign-macos.sh "${{ matrix.asset }}" testingbot-notary

    - name: Warn when the macOS bundle is unsigned
      if: runner.os == 'macOS' && env.HAS_SIGNING != 'true'
      run: |
        echo "::warning::macOS bundle released unsigned -- Gatekeeper will quarantine it. Set MACOS_CERTIFICATE_P12_BASE64 and APPLE_APP_SPECIFIC_PASSWORD."

    # Without credentials this still covers the module set that matters most:
    # startup, TLS and DNS via --doctor. The live tunnel checks are skipped.
    - name: Verify runtime
      shell: bash
      run: dist/verify-runtime.sh "dist/${{ matrix.asset }}"

    - name: Upload distribution to GitHub Releases
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
      with:
        files: |
          dist/${{ matrix.asset }}.tar.gz
          dist/${{ matrix.asset }}.zip
          dist/${{ matrix.asset }}.tar.gz.sha256
          dist/${{ matrix.asset }}.zip.sha256
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  central:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
        server-id: central
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
        gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
        gpg-passphrase: GPG_PASSPHRASE

    - name: Set version from tag
      run: |
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        mvn versions:set -DnewVersion=${TAG_VERSION} -DgenerateBackupPoms=false

    # Tests run in the build job; this job only deploys.
    - name: Deploy to Maven Central
      run: mvn -B clean deploy -DskipTests -Dgpg.passphrase=${{ secrets.GPG_PASSPHRASE }}
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Set version from tag
      run: |
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=${TAG_VERSION}" >> $GITHUB_ENV
        mvn versions:set -DnewVersion=${TAG_VERSION} -DgenerateBackupPoms=false

    - name: Build JAR
      run: mvn -B package -DskipTests

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          testingbot/tunnel:${{ env.VERSION }}
          testingbot/tunnel:latest
