---
services:
  # Opt-in tunnel service. Enable with `--profile tunnel` if you don't already
  # have a tunnel running on the host. Requires TESTINGBOT_KEY / TESTINGBOT_SECRET.
  testingbot-tunnel:
    image: testingbot/tunnel:latest
    pull_policy: always
    restart: on-failure
    profiles: ["tunnel"]
    environment:
      TESTINGBOT_KEY: ${TESTINGBOT_KEY:-}
      TESTINGBOT_SECRET: ${TESTINGBOT_SECRET:-}
    # Published on loopback only. 4445 is the Selenium relay, which attaches this
    # account's TestingBot key and secret to every request it forwards, and 8087 is
    # an unauthenticated forward proxy into whatever this host can reach, its own
    # loopback included. Bound to every interface -- and published Docker ports
    # bypass the host firewall on Linux -- either one hands that to the network.
    #
    # 8003 is not published at all: Prometheus reaches it as "testingbot-tunnel:8003"
    # over the compose network, so the metrics endpoint never touches the host.
    ports:
      - "127.0.0.1:4445:4445"
      - "127.0.0.1:8087:8087"
    command: >
      --localproxy 8087
      --metrics-port 8003

  prometheus:
    image: prom/prometheus:v2.55.0
    restart: always
    # host.docker.internal is built-in on Docker Desktop (macOS / Windows).
    # On Linux, host-gateway resolves it to the host's gateway IP.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/:/etc/prometheus/
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    # Loopback: the query API answers anything about this stack to anyone who asks.
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:10.4.3
    restart: always
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/:/etc/grafana/provisioning/
    env_file:
      - ./grafana/config.monitoring
    environment:
      # No default on purpose: compose refuses to start until one is supplied, so the
      # stack cannot come up with a password that is published in this repository.
      # Set it in .env next to this file, or export it before `docker compose up`.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD to a password of your own}
    # Loopback: an admin session here can add a datasource pointing at any address
    # this container can reach, and Grafana will fetch it server-side.
    ports:
      # Override the host port if 3000 is taken: GRAFANA_PORT=3001 docker compose up
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

volumes:
  prometheus_data:
  grafana_data:
