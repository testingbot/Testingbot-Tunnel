# TestingBot Tunnel configuration
#
#   java -jar testingbot-tunnel.jar --config testingbot-tunnel.conf
#
# Keys are long option names without the leading dashes, so this file mirrors the
# command line one-for-one. Anything given explicitly on the command line wins.
# Run with --help to see every available option.

# Credentials. Prefer TESTINGBOT_KEY/TESTINGBOT_SECRET or ~/.testingbot for these;
# a config file on disk is a poor place for secrets.
# client-key    = your-key
# client-secret = your-secret

# Ports
# se-port      = 4445
# localproxy   = 8087
# metrics-port = 8003

# Upstream proxy: host:port (HTTP), http://host:port, or socks5://host:port
# proxy         = socks5://corp-proxy.internal:1080
# proxy-userpwd = user:password

# Boolean options: set to true to enable, omit or set false to leave off
# nobump  = true
# nocache = true
# shared  = true

# Domains to bypass the tunnel entirely (comma separated regular expressions)
# fast-fail-regexps = ads\.example\.com,.*\.tracker\.net

# Extra headers injected into proxied requests (JSON object)
# extra-headers = {"X-Environment":"staging"}

# Protect the Prometheus endpoint
# metrics-auth = user:password

# tunnel-identifier = my-tunnel
# log-level = info
